<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .star-bg { fill: #5c7b9b; stroke: #ffffff; stroke-width: 7; stroke-linejoin: miter; stroke-miterlimit: 4; }
      .star-inner { fill: none; stroke: #ffffff; stroke-width: 5.5; stroke-linejoin: miter; stroke-miterlimit: 4; }
      .txt-top-smk { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 23px; font-weight: 800; fill: #ffffff; text-anchor: middle; letter-spacing: 0.5px; }
      .txt-top-ibnul { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 30px; font-weight: 900; fill: #ffffff; text-anchor: middle; letter-spacing: 1px; }
      .txt-arabic { font-family: 'KacstPoster', 'KacstTitle', 'Amiri', 'Traditional Arabic', 'Noto Naskh Arabic', 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <!-- 8-Pointed Islamic Star (Rub el Hizb) Base & Outer White Border -->
  <polygon points="256.0,14.0 321.82,97.09 427.12,84.88 414.91,190.18 498.0,256.0 414.91,321.82 427.12,427.12 321.82,414.91 256.0,498.0 190.18,414.91 84.88,427.12 97.09,321.82 14.0,256.0 97.09,190.18 84.88,84.88 190.18,97.09" class="star-bg"/>

  <!-- Concentric Inner White Border -->
  <polygon points="256.0,34.0 316.46,110.03 412.98,99.02 401.97,195.54 478.0,256.0 401.97,316.46 412.98,412.98 316.46,401.97 256.0,478.0 195.54,401.97 99.02,412.98 110.03,316.46 34.0,256.0 110.03,195.54 99.02,99.02 195.54,110.03" class="star-inner"/>

  <!-- Top Institutional Wordmark -->
  <text x="256" y="136" class="txt-top-smk">SMK ISLAM TERPADU</text>
  <text x="256" y="168" class="txt-top-ibnul">IBNUL QAYYIM</text>

  <!-- Center Open Book Icon -->
  <g fill="#ffffff" transform="translate(256, 266)">
    <!-- Left Main Page -->
    <path d="M -7.5,-44 C -28,-47 -58,-37 -70,-34 C -74,-33 -77,-30 -77,-26 L -77,16 C -77,20 -74,23 -70,22 C -58,19 -28,10 -7.5,15 Z"/>
    <!-- Left Bottom Cover Accent -->
    <path d="M -7.5,23 C -28,18 -58,26 -70,29 C -74,30 -77,28 -77,24 L -77,28 C -77,32 -74,35 -70,34 C -58,31 -28,23 -7.5,29 Z"/>

    <!-- Right Main Page -->
    <path d="M 7.5,-44 C 28,-47 58,-37 70,-34 C 74,-33 77,-30 77,-26 L 77,16 C 77,20 74,23 70,22 C 58,19 28,10 7.5,15 Z"/>
    <!-- Right Bottom Cover Accent -->
    <path d="M 7.5,23 C 28,18 58,26 70,29 C 74,30 77,28 77,24 L 77,28 C 77,32 74,35 70,34 C 58,31 28,23 7.5,29 Z"/>
  </g>

  <!-- Bottom Arabic Text: مدرسة ابن القيم -->
  <text x="256" y="384" class="txt-arabic">ﻣﺪﺭﺳﺔ ﺍﺑﺐ ﺍﻝﻘﻴﻢ</text>
</svg>