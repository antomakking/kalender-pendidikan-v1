      if (event.category === 'holiday') return HOLIDAY_STYLE;
      const nonHolidays = monthEvents.filter(e => e.category !== 'holiday');

                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Cari kegiatan, ujian, libur..."
                    className="w-full pl-8 pr-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#143c14]"
                  />
                  <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2"></i>
                </div>
              </div>

              {/* Category Filter Pills */}
              <div className="flex flex-wrap items-center gap-1.5 text-xs pt-2 border-t border-slate-100">
                <button
                  onClick={() => setCategoryFilter('all')}
                  className={`px-2.5 py-1 rounded-lg font-bold ${categoryFilter === 'all' ? 'bg-[#143c14] text-white' : 'bg-slate-100 text-slate-700'}`}
                >
                  Semua
                </button>
                <button
                  onClick={() => setCategoryFilter('academic')}
                  className={`px-2.5 py-1 rounded-lg font-bold border ${categoryFilter === 'academic' ? 'bg-[#ffcc00] text-slate-950 border-amber-500' : 'bg-amber-50 text-amber-950 border-amber-300'}`}
                >
                  KBM & Ujian
                </button>
                <button
                  onClick={() => setCategoryFilter('student')}
                  className={`px-2.5 py-1 rounded-lg font-bold border ${categoryFilter === 'student' ? 'bg-[#0284c7] text-white border-sky-600' : 'bg-sky-50 text-sky-950 border-sky-300'}`}
                >
                  Kesiswaan & PKL
                </button>
                <button
                  onClick={() => setCategoryFilter('holiday')}
                  className={`px-2.5 py-1 rounded-lg font-bold border ${categoryFilter === 'holiday' ? 'bg-[#dc2626] text-white border-rose-600' : 'bg-rose-50 text-rose-950 border-rose-300'}`}
                >
                  Hari Libur
                </button>
              </div>
            </div>

            {/* VIEW 1: 12-MONTH CALENDAR POSTER GRID */}
            {currentView === 'year' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                  {monthsList.map(({ year, month }) => {
                    const monthEvents = filteredEvents.filter(e => {
                      const startYM = e.startDate.slice(0, 7);
                      const endYM = e.endDate.slice(0, 7);
                      const curYM = `${year}-${String(month + 1).padStart(2, '0')}`;
                      return curYM >= startYM && curYM <= endYM;
                    });

                    const firstDayOfMonth = new Date(year, month, 1);
                    const daysInMonth = new Date(year, month + 1, 0).getDate();
                    const startDayOfWeek = (firstDayOfMonth.getDay() + 6) % 7; // Monday = 0

                    return (
                      <div key={`${year}-${month}`} className="bg-white border-2 border-slate-200 rounded-xl p-3 shadow-xs flex flex-col justify-start">
                        {/* Card Header */}
                        <div className="bg-[#143c14] text-white py-1.5 px-3 rounded-lg flex items-center justify-between mb-2">
                          <span className="font-black text-xs uppercase tracking-wider">{MONTH_NAMES_ID[month]} {year}</span>
                          <span className="text-[10px] font-bold text-amber-300">{monthEvents.length} Agenda</span>
                        </div>

                        {/* Day Names */}
                        <div className="grid grid-cols-7 gap-1 text-center font-extrabold text-[9px] mb-1">
                          {['Sn', 'Sl', 'Rb', 'Km', 'Jm', 'Sb', 'Ah'].map((d, idx) => (
                            <div key={d} className={`py-0.5 rounded ${idx === 6 ? 'text-[#dc2626]' : 'text-[#143c14]'}`}>{d}</div>
                          ))}
                        </div>

                        {/* Dates Grid */}
                        <div className="grid grid-cols-7 gap-1 text-center text-[10px]">
                          {Array.from({ length: startDayOfWeek }).map((_, i) => (
                            <div key={`empty-${i}`} className="py-1" />
                          ))}

                          {Array.from({ length: daysInMonth }).map((_, i) => {
                            const dayNum = i + 1;
                            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                            const dateObj = new Date(year, month, dayNum);
                            const isSunday = (dateObj.getDay() + 6) % 7 === 6;
                            const dayEvts = monthEvents.filter(e => dateStr >= e.startDate && dateStr <= e.endDate);
                            const primaryEvt = dayEvts[0];
                            const evtStyle = primaryEvt ? getEventColorInMonth(primaryEvt, monthEvents) : null;

                            return (
                              <div
                                key={dateStr}
                                onClick={() => primaryEvt && setSelectedEvent(primaryEvt)}
                                className={`py-1 rounded-md flex flex-col items-center justify-center cursor-pointer ${
                                  evtStyle
                                    ? `${evtStyle.bgSolid} shadow-2xs`
                                    : isSunday
                                    ? 'text-[#dc2626] font-bold hover:bg-rose-50'
                                    : 'text-slate-700 hover:bg-slate-100 font-medium'
                                }`}
                              >
                                <span>{dayNum}</span>
                              </div>
                            );
                          })}
                        </div>

                        {/* Month Agenda Highlights */}
                        <div className="mt-2.5 pt-2 border-t border-slate-100 text-[11px] flex-1 flex flex-col justify-start">
                          {monthEvents.length > 0 ? (
                            <div className="space-y-1">
                              <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Agenda ({monthEvents.length})</span>
                              {monthEvents.map(evt => {
                                const evtStyle = getEventColorInMonth(evt, monthEvents);
                                const sDay = parseInt(evt.startDate.slice(8), 10);
                                const eDay = parseInt(evt.endDate.slice(8), 10);
                                const dateRangeText = sDay === eDay ? `${sDay}` : `${sDay}–${eDay}`;

                                return (
                                  <div
                                    key={evt.id}
                                    onClick={() => setSelectedEvent(evt)}
                                    className={`truncate text-[10px] font-semibold px-2 py-0.5 rounded cursor-pointer flex items-center justify-between gap-1 ${evtStyle.bgSolid}`}
                                  >
                                    <span className="truncate flex-1">{evt.title}</span>
                                    <span className="text-[9px] opacity-85 shrink-0 font-mono">{dateRangeText} {MONTH_NAMES_ID[month].slice(0, 3)}</span>
                                  </div>
                                );
                              })}
                            </div>
                          ) : (
                            <div className="text-[10px] text-slate-400 italic py-1">KBM Reguler sesuai jadwal</div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Bottom Disclaimer */}
                <div className="bg-[#143c14] text-white rounded-xl p-3 text-center text-xs font-bold border-t-2 border-[#ffcc00]">
                  <span className="text-[#ffcc00] uppercase mr-1">PERHATIAN:</span>
                  Jadwal dapat berubah mengikuti informasi dari Pemerintah dan Yayasan. Seluruh perubahan jadwal akan diumumkan melalui surat edaran resmi.
                </div>
              </div>
            )}

            {/* VIEW 2: AGENDA LIST */}
            {currentView === 'agenda' && (
              <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-xs space-y-4">
                <h3 className="font-bold text-base text-slate-900">Seluruh Agenda Terjadwal ({filteredEvents.length})</h3>
                <div className="space-y-2">
                  {filteredEvents.map(evt => (
                    <div
                      key={evt.id}
                      onClick={() => setSelectedEvent(evt)}
                      className="p-3 rounded-xl border border-slate-200 hover:border-emerald-600 transition-colors cursor-pointer flex items-center justify-between gap-4"
                    >
                      <div className="space-y-1">
                        <div className="flex items-center gap-2">
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${evt.category === 'holiday' ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-950'}`}>
                            {evt.category.toUpperCase()}
                          </span>
                          <span className="text-xs font-bold text-slate-500">{evt.startDate} s/d {evt.endDate}</span>
                        </div>
                        <h4 className="font-bold text-sm text-slate-900">{evt.title}</h4>
                        <p className="text-xs text-slate-600">{evt.description}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* DETAIL MODAL */}
          {selectedEvent && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4" onClick={() => setSelectedEvent(null)}>
              <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-3" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                  <span className="text-xs font-bold text-emerald-800 uppercase tracking-wider">Detail Agenda</span>
                  <button onClick={() => setSelectedEvent(null)} className="text-slate-400 hover:text-slate-600 text-sm font-bold">✕</button>
                </div>
                <h3 className="text-base font-bold text-slate-900">{selectedEvent.title}</h3>
                <p className="text-xs text-slate-600 leading-relaxed">{selectedEvent.description}</p>
                <div className="text-xs text-slate-500 space-y-1 pt-2 border-t border-slate-100">
                  <div>📅 <strong>Tanggal:</strong> {selectedEvent.startDate} s/d {selectedEvent.endDate}</div>
                  <div>📍 <strong>Lokasi:</strong> {selectedEvent.location}</div>
                  <div>👥 <strong>Peserta:</strong> {selectedEvent.audience}</div>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-white border-t border-slate-200 py-6 text-xs text-slate-500 mt-12 text-center">
            <p className="font-semibold text-slate-800">© 2026 SMK IT Ibnul Qayyim Makassar · Sistem Informasi Kalender Akademik Standalone</p>
            <p className="text-slate-400 mt-0.5">Konsentrasi Keahlian: Rekayasa Perangkat Lunak (RPL) & Bisnis Digital (BD)</p>
          </footer>
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
